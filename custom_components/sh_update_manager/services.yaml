scan_all:
  name: Scan All Queues
  description: Scan all configured queues for pending updates.

start_queue:
  name: Start Queue
  description: Start processing a specific queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to start.
      required: true
      example: "Z-Wave Firmware"
      selector:
        text:

stop_queue:
  name: Stop Queue
  description: Stop a running queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to stop.
      required: true
      example: "Z-Wave Firmware"
      selector:
        text:

pause_queue:
  name: Pause Queue
  description: Pause a running queue (can be resumed).
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to pause.
      required: true
      selector:
        text:

resume_queue:
  name: Resume Queue
  description: Resume a paused queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to resume.
      required: true
      selector:
        text:

skip_current:
  name: Skip Current
  description: Skip the item currently being installed in a queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue.
      required: true
      selector:
        text:

clear_queue:
  name: Clear Queue
  description: Clear all pending items from a queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to clear.
      required: true
      selector:
        text:

retry_failed:
  name: Retry Failed
  description: Re-queue all failed items in a queue and restart processing.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue.
      required: true
      selector:
        text:

scan_queue:
  name: Scan Queue
  description: Scan a single queue for pending updates.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to scan.
      required: true
      selector:
        text:

add_queue:
  name: Add Queue
  description: Create a new update queue.
  fields:
    queue_name:
      name: Queue Name
      description: Name for the new queue.
      required: true
      example: "Z-Wave Firmware"
      selector:
        text:
    match_type:
      name: Match Type
      description: How to match update entities.
      required: false
      default: "integration"
      selector:
        select:
          options:
            - "integration"
            - "area"
            - "label"
            - "entity"
            - "device_name"
            - "manufacturer"
    match_value:
      name: Match Values
      description: >-
        Comma-separated values to match. For integration: platform names (zwave_js,esphome).
        For device_name: partial device/model name (Zooz,ZEN71). For manufacturer: exact manufacturer name.
      required: false
      default: ""
      selector:
        text:
    exclude_pattern:
      name: Exclude Pattern
      description: >-
        Comma-separated patterns to EXCLUDE from this queue. Matched case-insensitively
        against device name, manufacturer, model, entity ID, and friendly name.
        Example: "ZEN32,Inovelli" to exclude all ZEN32 and Inovelli devices.
      required: false
      default: ""
      selector:
        text:
    exec_mode:
      name: Execution Mode
      description: How updates are processed (sequential or parallel).
      required: false
      default: "sequential"
      selector:
        select:
          options:
            - "sequential"
            - "parallel"
    trigger_mode:
      name: Trigger Mode
      description: When the queue runs (manual or auto_on_scan).
      required: false
      default: "manual"
      selector:
        select:
          options:
            - "manual"
            - "auto_on_scan"
    battery_handling:
      name: Battery Handling
      description: How to handle battery-powered devices.
      required: false
      default: "exclude"
      selector:
        select:
          options:
            - "exclude"
            - "defer_to_end"
            - "include"
    priority:
      name: Priority
      description: Queue execution priority (1-100, lower = higher priority).
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 100
    stop_on_failure:
      name: Stop on Failure
      description: Stop the queue if an update fails.
      required: false
      default: false
      selector:
        boolean:
    skip_unavailable:
      name: Skip Unavailable
      description: Skip entities that are unavailable.
      required: false
      default: true
      selector:
        boolean:
    resume_after_restart:
      name: Resume After Restart
      description: Restart a run that was interrupted by a Home Assistant restart or reload, once Home Assistant has started.
      required: false
      default: false
      selector:
        boolean:
    install_delay:
      name: Install Delay
      description: Seconds to wait between installs (0-300).
      required: false
      default: 15
      selector:
        number:
          min: 0
          max: 300
    install_timeout:
      name: Install Timeout
      description: Seconds to wait for a single install (60-14400).
      required: false
      default: 7200
      selector:
        number:
          min: 60
          max: 14400
    max_retries:
      name: Max Retries
      description: Number of retry attempts for failed installs (0-10).
      required: false
      default: 2
      selector:
        number:
          min: 0
          max: 10
    history_count:
      name: History Count
      description: Number of past runs to keep per queue (1-100).
      required: false
      default: 25
      selector:
        number:
          min: 1
          max: 100

